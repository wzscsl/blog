{{ define "main" }}
<section class="collection-page"><p class="eyebrow">{{ .Data.Plural | upper }} / 知识索引</p><h1>{{ .Title }}</h1><p class="lede">从一个关键词，重新走进一个问题。</p><div class="term-grid">{{ range .Data.Terms.ByCount }}<a class="term-card" href="{{ .Page.RelPermalink }}"><span class="term-symbol">#</span><h2>{{ .Page.Title }}</h2><span>{{ .Count }} 篇笔记 <span aria-hidden="true">↗</span></span></a>{{ end }}</div><div class="index-links"><a href="{{ "categories/" | relURL }}">按分类探索 →</a><a href="{{ "series/" | relURL }}">按系列阅读 →</a></div></section>
{{ end }}
